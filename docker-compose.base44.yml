# Base44 sandbox environment for this repository.
#
# This repo is a static site: four standalone HTML pages with inline CSS/JS and no
# build step, no package manager and no backend. The "app" IS the source, so the
# service below mounts the checkout read-only and serves it directly — edits on disk
# show up on refresh, with no image rebuild.
#
# The pages call the Groq API straight from the browser, using a key the user pastes
# into each page's own settings panel (kept in localStorage). No server-side
# environment variables or secrets are required to boot, so there is no env_file here.
services:
  web:
    image: python:3.12-slim
    working_dir: /app
    # Static file server bound to 0.0.0.0 so the preview proxy can reach it.
    # python -m http.server uses a threading server and serves index.html at "/".
    command: ["python", "-m", "http.server", "3000", "--bind", "0.0.0.0", "--directory", "/app"]
    volumes:
      - ./:/app:ro
    ports:
      - "3000:3000"
    labels:
      base44.project: "AutoMind Agency"
      base44.kind: "web"
      base44.port: "3000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              r = urllib.request.urlopen("http://127.0.0.1:3000/", timeout=4)
              sys.exit(0 if r.status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: on-failure
